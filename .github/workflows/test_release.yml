name: Test Python 🐍 distribution 📦 to TestPyPI

on:
  workflow_dispatch:
    inputs:
      iteration:
        description: "A unique iteration for the run. The tag will be suffixed with .devyyyymmdd "
        type: string
        required: true
        default: "0"
  schedule:
    - cron: "12 3 2 * *"
  push:
    tags:
      - "*"

env:
  PYPI_TEST_URL: https://test.pypi.org/p/django-debug-toolbar
  DEV_VERSION_ENV_KEY: DEBUG_TOOLBAR_VERSION_DEV

permissions: {}

jobs:
  create-dev-version:
    name: Create dev version string
    if: github.repository == 'django-commons/django-debug-toolbar'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      dev_version: ${{ steps.output-dev-version.outputs.dev_version }}
    steps:
      - name: Set date suffix
        id: set-date
        run: echo "suffix=dev$(date +%Y%m%d)" >> $GITHUB_ENV
      - name: Determine Iteration Value
        id: set-iteration
        env:
          ITERATION_INPUT: ${{ github.event.inputs.iteration }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "iteration=$ITERATION_INPUT" >> $GITHUB_ENV
          else
            echo "iteration=0" >> $GITHUB_ENV
          fi
      - name: Output dev version
        id: output-dev-version
        env:
          SUFFIX: ${{ env.suffix }}
          ITERATION: ${{ env.iteration }}
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags') }}" == "true" ]]; then
            echo "dev_version=" >> "$GITHUB_OUTPUT"
          else
            echo "dev_version=${SUFFIX}${ITERATION}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution 📦
    needs:
      - create-dev-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install pypa/build
        run: python3 -m pip install build --user
      - name: Build a binary wheel and a source tarball
        env:
          DEV_VERSION: ${{ needs.create-dev-version.outputs.dev_version }}
        run: env "${DEV_VERSION_ENV_KEY}=${DEV_VERSION}" python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: ${{ env.PYPI_TEST_URL }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
